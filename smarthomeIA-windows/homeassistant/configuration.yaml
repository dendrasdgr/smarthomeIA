# Configuração base do Home Assistant (versão Windows).
# Ficheiro montado em /config dentro do contentor (.\homeassistant).

default_config:

# Necessário para o acesso por HTTPS via Tailscale (tailscale serve).
# No Windows o Docker Desktop faz NAT, por isso o pedido chega ao Home Assistant
# a partir do gateway interno do Docker (172.x ou 192.168.65.x) e não de 127.0.0.1.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.16.0.0/12
    - 192.168.65.0/24

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
